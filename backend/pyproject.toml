[project]
name = "auditrl"
version = "0.1.0"
description = "Source-grounded auditing of AI-generated financial research reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "litellm>=1.50",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "markdown>=3.7",
]

[project.scripts]
auditrl = "auditrl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
